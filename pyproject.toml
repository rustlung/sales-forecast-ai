[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-forecast-ai"
version = "0.1.0"
description = "Sales data import foundation for Sales Forecast AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pandas>=2.2,<3",
    "prophet>=1.1,<2",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/sales_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
