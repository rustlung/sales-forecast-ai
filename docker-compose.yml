services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_forecast
      POSTGRES_USER: sales_forecast
      POSTGRES_PASSWORD: sales_forecast
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_forecast -d sales_forecast"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    image: sales-forecast-ai-app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "sales_forecast.scripts.smoke_check"]

  dashboard:
    image: sales-forecast-ai-app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["streamlit", "run", "src/sales_forecast/ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"

volumes:
  postgres_data:
